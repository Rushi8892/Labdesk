kind = "web"
previewPath = "/"
title = "LabDesk • Laboratory Management"
description = "Desktop laboratory test configuration, contextual reference approvals, dynamic result entry and immutable released reports."
version = "1.0.0"
id = "artifacts/labdesk"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22204

[services.development]
run = "pnpm --filter @workspace/labdesk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/labdesk", "run", "build" ]
serve = "static"
publicDir = "artifacts/labdesk/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22204"
BASE_PATH = "/"
