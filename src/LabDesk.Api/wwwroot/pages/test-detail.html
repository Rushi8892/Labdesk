<div class="scroll flex-1" data-slot="state" hidden></div>
<div class="col flex-1" data-slot="content" hidden>
  <header class="page-head no-print">
    <div><h1 data-slot="title"></h1><div class="page-sub"><a href="#/" data-testid="link-back-catalog"><svg class="ic" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M19 12H5"/></svg> Test catalog</a></div></div>
    <div class="page-actions" data-slot="actions"></div>
  </header>
  <div class="info-grid" data-slot="info"></div>
  <div class="split">
    <section class="col" style="flex:1;min-width:0;border-right:1px solid hsl(var(--border))">
      <div class="sec-head"><div class="b">Parameters <span class="mono muted" data-slot="pcount"></span></div>
        <button class="btn btn-primary btn-sm" data-act="new-param" data-testid="button-new-parameter"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> New parameter&hellip;</button></div>

        <input class="input" data-quick="unit" placeholder="Unit" aria-label="Unit" data-testid="input-quick-unit">
        <input class="input" data-quick="reference" placeholder="Reference, e.g. 12.0 - 15.0" aria-label="Reference" data-testid="input-quick-reference">
        <select class="select" data-quick="dataType" aria-label="Data type" data-testid="select-quick-type">
          <option>Numeric</option><option>Text</option><option>Dropdown</option><option>Boolean</option><option>Date</option>

        <button class="btn btn-primary btn-sm" data-act="quick-add" data-testid="button-quick-add">Add</button>
      </div>
      <div class="scroll flex-1" data-slot="params"></div>
    </section>
    <aside class="aside" data-slot="aside"></aside>
  </div>
</div>
