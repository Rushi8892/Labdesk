<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabDesk</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar no-print">
      <div class="brand">
        <div class="brand-mark"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="m9 9.5 2 2 4-4"/></svg></div>
        <div><div class="brand-name">LabDesk</div><div class="brand-sub">Workstation</div></div>
      </div>
      <nav class="nav" id="nav">
        <a class="navlink" href="#/" data-nav="tests" data-testid="link-nav-test-catalog"><span class="nl">Test catalog</span><span class="cnt mono" data-testid="text-count-test-catalog" hidden></span></a>
        <a class="navlink" href="#/results" data-nav="results" data-testid="link-nav-results"><span class="nl">Results</span><span class="cnt mono" data-testid="text-count-results" hidden></span></a>
        <a class="navlink" href="#/reports" data-nav="reports" data-testid="link-nav-reports"><span class="nl">Reports</span></a>
        <a class="navlink" href="#/masters" data-nav="masters" data-testid="link-nav-masters"><span class="nl">Masters</span></a>
        <a class="navlink" href="#/references" data-nav="references" data-testid="link-nav-references"><span class="nl">References</span><span class="cnt mono" data-testid="text-count-references" hidden></span></a>
        <a class="navlink" href="#/audit" data-nav="audit" data-testid="link-nav-audit"><span class="nl">Audit</span></a>
      </nav>
      <div class="side-foot">
        <div class="health" data-testid="status-health"><span class="dot" id="health-dot"></span><span id="health-text">Checking service</span></div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div id="modals"></div>
  <div class="toasts no-print" id="toasts"></div>
</body>
</html>
