<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G.S. LAB</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar no-print">
      <div class="brand">
        <img class="brand-mark" src="img/gs-lab-mark.png" alt="" width="23" height="40">
        <div>
          <div class="brand-name" data-slot="brand"></div>
          <div class="brand-sub">Accurate &middot; Reliable &middot; Trusted</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a class="navlink" href="#/" data-nav="tests" data-testid="link-nav-test-catalog"><span class="nl">Test catalog</span><span class="cnt mono" data-testid="text-count-test-catalog" hidden></span></a>
        <a class="navlink" href="#/patients" data-nav="patients" data-testid="link-nav-patients"><span class="nl">Patients</span></a>
        <a class="navlink" href="#/results" data-nav="results" data-testid="link-nav-results"><span class="nl">Results</span><span class="cnt mono" data-testid="text-count-results" hidden></span></a>
        <a class="navlink" href="#/reports" data-nav="reports" data-testid="link-nav-reports"><span class="nl">Reports</span></a>
        <a class="navlink" href="#/masters" data-nav="masters" data-testid="link-nav-masters"><span class="nl">Masters</span></a>
        <a class="navlink" href="#/audit" data-nav="audit" data-testid="link-nav-audit"><span class="nl">Audit</span></a>
      </nav>
      <div class="side-foot">
        <div class="health" data-testid="status-health"><span class="dot" id="health-dot"></span><span id="health-text">Checking service</span></div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div id="modals"></div>
  <div class="toasts no-print" id="toasts"></div>
</body>
</html>
